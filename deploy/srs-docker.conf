# SRS Docker configuration — RTMP + HTTP-FLV + HTTP Callback
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # HTTP-FLV: 前端 LivePlayer.vue 用 http://<host>:8000/live/<stream_key>.flv
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS（与镜像默认 docker.conf 行为保持一致，便于排查/兜底播放）
    hls {
        enabled         on;
        hls_fragment    3;
        hls_window      30;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        # 关掉 hls_ctx：否则 m3u8 会重定向成带 ?hls_ctx= 的主播放列表，
        # 部分播放器（安卓 MediaPlayer）解析不稳。直播不需要会话级 HLS。
        hls_ctx         off;
        # 下面这路转码产物会一起写进 [app]/[stream].m3u8 的主播放列表，
        # 客户端按 #EXT-X-STREAM-INF 就能列出「原画 / 流畅」并自己切
        # 变体由客户端按 [stream]_[engine] 约定自己拼（SRS 的 hls_variant 校验太挑）
    }

    # 一路 480p 转码：直播端「清晰度」里的「流畅」就是它
    transcode {
        enabled         on;
        ffmpeg          ./objs/ffmpeg/bin/ffmpeg;
        engine sd {
            enabled     on;
            vfilter {
                vf      "scale=-2:480";
            }
            vcodec      libx264;
            vbitrate    800;
            vfps        25;
            vthreads    2;
            vprofile    main;
            vpreset     veryfast;
            acodec      aac;
            abitrate    64;
            asample_rate 44100;
            achannels   2;
            output      rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }
    }

    # HTTP callback: notify Go backend when stream starts/ends
    http_hooks {
        enabled     on;
        on_publish  http://backend:8080/api/v1/live/callback/on_publish;
        on_unpublish http://backend:8080/api/v1/live/callback/on_done;
    }
}
