[package]
name = "cakecake-rs"
version = "0.4.0"
edition = "2021"
description = "cakecake 移动客户端的纯 Rust 实现（egui 壳 + 自绘内容层）"

[lib]
name = "cakecake_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cakecake-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "wgpu",
    "glow",
    "clipboard",
    "links",
    "android-native-activity",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
# 直播播放：JNI 调系统 MediaPlayer（硬解）+ glow 绘制回调自绘 OES 纹理
jni = "0.21"
egui_glow = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# ---- Android 打包配置（cargo apk build 读取）----
[package.metadata.android]
package = "com.cakecake.rust"
apk_name = "cakecake-rs"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

# 开发期直连本机 HTTP 后端所需
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
uses_cleartext_traffic = true

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.signing.release]
# 密钥与口令都不入库：keystore 文件本地保留（.gitignore 已排除），
# 口令由 scripts/build-apk.sh 在构建时从 .keystore-pass / 环境变量临时填入。
path = "cakecake.keystore"
keystore_password = ""

