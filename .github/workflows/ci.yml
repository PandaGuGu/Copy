# ============================================================
# CI — 代码质量检查
# 触发条件: push 到任意分支 + Pull Request 到 main
# 检查项: Go 编译 / Go vet / Go test / 前端构建 / 提交信息
# ============================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端检查
  # ============================================================
  backend-check:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Proxy (China)
        run: go env -w GOPROXY=https://goproxy.cn,direct

      - name: Download dependencies
        run: go mod download

      - name: Go build
        run: go build -v ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1 -race -timeout 180s

  # ============================================================
  # 前端检查
  # ============================================================
  frontend-check:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cakecake-vue/bilibili-vue/package-lock.json

      - name: Install dependencies
        working-directory: cakecake-vue/bilibili-vue
        run: npm ci

      - name: Build
        working-directory: cakecake-vue/bilibili-vue
        run: npm run build

  # ============================================================
  # 提交信息检查
  # ============================================================
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 用 git 原生对 PR 相对 base 的所有 commit subject 逐一校验
      - name: Validate commit messages
        run: |
          BASE_SHA="${GITHUB_BASE_REF_SHA:-$(git rev-parse origin/main)}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix|wip)(\([^)]+\))?!?: .{1,100}$'
          fail=0
          echo "Validating commits from $BASE_SHA..HEAD"
          while read -r subject; do
            echo "  $subject"
            if ! echo "$subject" | grep -qE "$PATTERN"; then
              echo "::error::Commit subject does not match Conventional Commits: $subject"
              fail=1
            fi
          done < <(git log --format='%s' "$BASE_SHA..HEAD")
          if [ "$fail" -ne 0 ]; then
            echo "提交信息不符合 Conventional Commits 规范！"
            echo "要求格式: <type>(<scope>): <description>"
            echo "合法 type: feat fix docs style refactor perf test build ci chore revert hotfix wip"
            echo "示例: feat(video): 添加弹幕发送功能"
            exit 1
          fi

  # ============================================================
  # 敏感信息扫描
  # ============================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude

  # ============================================================
  # 性能回归门槛（k6 SLO）
  # 流程: 起 MySQL/Redis → development 模式起后端(自动建表) → k6 跑 SLO 压测
  # 若任何 SLO 超限，k6 以 exit 99 退出，本 job 变红阻塞合并。
  # ============================================================
  perf-check:
    name: Performance (k6 SLO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 后端启动必需变量；JWT_SECRET 不能留空（main.go 校验非空）
      JWT_SECRET: ci-test-secret
      APP_ENV: development
      HTTP_ADDR: :8080
      MYSQL_DSN: "minibili:cakecake123@tcp(127.0.0.1:3306)/minibili?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Proxy (China)
        run: go env -w GOPROXY=https://goproxy.cn,direct

      # 只起后端依赖（mysql/redis），后端在宿主进程跑以便连接本机端口
      - name: Start MySQL & Redis
        run: |
          docker compose up -d mysql redis
          for i in $(seq 1 30); do
            if docker exec cake-mysql mysqladmin ping -h localhost >/dev/null 2>&1; then
              echo "mysql ready"; break
            fi
            sleep 3
          done

      - name: Build backend
        run: go build -o mini-bili ./cmd/mini-bili/

      # development 模式会自动建表（data.go: AutoMigrate 仅在 APP_ENV=development 生效），
      # 数据库用 compose 的默认凭据（minibili/cakecake123）连本机端口
      - name: Start backend (dev, auto-migrate)
        run: |
          nohup ./mini-bili > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "backend ready"; break
            fi
            sleep 3
          done
          curl -sf http://127.0.0.1:8080/api/v1/health || { echo "backend failed"; cat backend.log; exit 1; }

      # k6 在 host 网络容器中打宿主机 8080
      - name: Run k6 SLO load test
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/scripts/k6:/scripts" \
            grafana/k6:latest run /scripts/load.js

      - name: Show backend log (on continuation)
        if: always()
        run: cat backend.log || true
