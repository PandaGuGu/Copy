# ============================================================
# CI — 代码质量检查
# 触发条件: push 到任意分支 + Pull Request 到 main
# 检查项: Go 编译 / Go vet / Go test / 前端构建 / 提交信息
# ============================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端检查
  # ============================================================
  backend-check:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Proxy (China)
        run: go env -w GOPROXY=https://goproxy.cn,direct

      - name: Download dependencies
        run: go mod download

      - name: Go build
        run: go build -v ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1 -timeout 120s -v 2>&1 || true

  # ============================================================
  # 前端检查
  # ============================================================
  frontend-check:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cakecake-vue/bilibili-vue/package-lock.json

      - name: Install dependencies
        working-directory: cakecake-vue/bilibili-vue
        run: npm ci

      - name: Build
        working-directory: cakecake-vue/bilibili-vue
        run: npm run build

  # ============================================================
  # 提交信息检查
  # ============================================================
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: tim-actions/commit-message-checker@v0.3.1
        with:
          pattern: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix|wip)(\([^)]+\))?!?: .{1,100}$'
          error: |
            提交信息不符合 Conventional Commits 规范！

            要求格式: <type>(<scope>): <description>

            合法 type:
              feat  fix  docs  style  refactor  perf  test
              build  ci  chore  revert  hotfix  wip

            示例:
              feat(video): 添加弹幕发送功能
              fix(auth): 修复 JWT 刷新 Token 过期逻辑

          check-all-commits: true

  # ============================================================
  # 敏感信息扫描
  # ============================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified --exclude-paths=.gitignore
