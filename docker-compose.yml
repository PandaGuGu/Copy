# ============================================================
# cakecake / MiniBili — Docker Compose 一键部署
#
# 用法:
#   1. 复制 .env.example → .env（编辑 JWT_SECRET 即可，其余有默认值）
#   2. 构建前端: cd cakecake-vue/bilibili-vue && npm run build
#   3. docker compose up -d
#
# ⚠️ 生产部署前务必更改默认密码！
#   - MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD（默认 cakecake123）
#   - RABBITMQ_DEFAULT_PASS（默认 guest）
#   - ADMIN_SEED_PASSWORD（默认 change-me-admin）
#   请在 .env 中覆盖上述变量。
#
# 包含: MySQL / Redis / RabbitMQ / Elasticsearch(搜索) / SRS(直播) / Go后端 / Nginx
# 文件存储在本地卷 uploads_data，无需任何云服务。
# ============================================================

services:
  # ── 数据库 ──
  mysql:
    image: mysql:8.0
    container_name: cake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cakecake123}
      MYSQL_DATABASE: minibili
      MYSQL_USER: minibili
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cakecake123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cake-net

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: cake-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cake-net

  # ── 消息队列（视频转码） ──
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: cake-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cake-net

  # ── 搜索引擎 ──
  # 注意：ES 需要 vm.max_map_count >= 262144，Windows/WSL2 下默认偏低，
  # 首次启动前请运行桌面上的启动脚本（它会自动设置），否则容器会反复退出。
  elasticsearch:
    # 用 Elastic 官方仓库镜像：Docker Hub 上的 library/elasticsearch 在国内镜像站
    # 能解析 manifest 但 blob 拉不动，会一直卡住。
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: cake-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.ml.enabled=false
      # 16G 内存的机器，堆锁死在 512m，别让它自己涨
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - cake-net

  # ── 直播推流服务器 ──
  srs:
    image: ossrs/srs:5
    container_name: cake-srs
    restart: unless-stopped
    # 镜像默认 CMD 是 `./objs/srs -c conf/docker.conf`，不覆盖的话挂载进来的
    # deploy/srs-docker.conf 完全不会生效（http_hooks 不触发 → 后端永远收不到开播通知）。
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    volumes:
      - ./deploy/srs-docker.conf:/usr/local/srs/conf/srs.conf:ro
    ports:
      - "${SRS_RTMP_PORT:-1935}:1935"     # RTMP 推流
      - "${SRS_FLV_PORT:-8000}:8080"       # HTTP-FLV 播放
      - "${SRS_API_PORT:-1985}:1985"       # HTTP API
    healthcheck:
      # SRS 镜像里没有 curl 也没有 wget，只能用 bash 的 /dev/tcp 探端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1985' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cake-net
    depends_on:
      - backend

  # ── Go 后端 ──
  backend:
    build: .
    container_name: cake-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker 网络内地址覆盖
      - APP_ENV=${APP_ENV:-production}
      - HTTP_ADDR=:8080
      - MYSQL_DSN=${MYSQL_USER:-minibili}:${MYSQL_PASSWORD:-cakecake123}@tcp(mysql:3306)/minibili?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - SENSITIVE_WORDS_FILE=./configs/sensitive_words.txt
      - TEMP_UPLOAD_DIR=/app/data/tmp
      - FFPROBE_PATH=ffprobe
      - FFMPEG_PATH=ffmpeg
      # 搜索：默认连 compose 内的 elasticsearch 容器
      # （.env 里的 ELASTICSEARCH_URL 是给原生运行用的，容器内不生效；
      #   要接外部 ES/OpenSearch/Bonsai 请改这里的 ES_URL）
      - ELASTICSEARCH_URL=${ES_URL:-http://elasticsearch:9200}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      # 本地文件存储（无需任何 OSS/MinIO 配置）
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_PUBLIC_URL_PREFIX=${OSS_PUBLIC_URL_PREFIX:-}
    volumes:
      - backend_tmp:/app/data/tmp
      - uploads_data:/app/data/uploads
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cake-net

  # ── 前端 Nginx ──
  frontend:
    image: nginx:alpine
    container_name: cake-frontend
    restart: unless-stopped
    volumes:
      - ./cakecake-vue/bilibili-vue/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：busybox wget 会先试 ::1，
      # 而 nginx 只监听 IPv4（default.conf 是只读挂载，不会自动补 IPv6）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    networks:
      - cake-net

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  es_data:
  uploads_data:
  backend_tmp:

networks:
  cake-net:
    driver: bridge
